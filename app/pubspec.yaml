name: pm_mobile
description: "PM - 项目管理平台移动端（终端 + 文件管理）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # HTTP 请求
  dio: ^5.7.0
  # 本地持久化（token / 服务器地址）
  shared_preferences: ^2.3.2
  # 终端：原生 xterm 渲染（纯 Dart 实现 VT100/xterm 序列，不依赖 WebView）
  xterm: ^4.0.0
  # 文件选择（上传）
  file_picker: ^8.1.4
  # 保存文件到设备（下载）
  path_provider: ^2.1.4
  # 打开外部链接 / 分享文件
  share_plus: ^10.1.2
  # 图标
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
