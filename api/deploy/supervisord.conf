; 容器内进程管理 —— 同时跑 dotnet(API) + nginx(admin静态站+反代)
[supervisord]
nodaemon=true
user=root
logfile=/opt/api/logs/supervisord.log
pidfile=/run/supervisord.pid

; 让 supervisorctl 能连上（容器内运维用）
[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; PM 后端 API（仅监听容器内 6020，由 nginx 反代）
[program:pm-api]
command=dotnet /opt/api/Sb.Apps.Pm.WebApi.dll --urls=http://127.0.0.1:6020
directory=/opt/api
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=ASPNETCORE_ENVIRONMENT="Production",DOTNET_PRINT_TELEMETRY_MESSAGE="false"
; 等 nginx 后启亦可，dotnet 起得慢，先拉起
priority=10

; 部署看门狗 —— 独立于 pm-api 进程,部署后自动健康检查 + 失败回滚(见 framework docs/AI_Deploy_Resilience.md)
; 关键:它必须始终活着(autorestart),且不依赖 /app 内容(脚本烤在 /usr/local/bin),坏部署动不到它
[program:pm-deploy-guard]
command=/usr/local/bin/pm-deploy-guard.sh
autostart=true
autorestart=true
startretries=999
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=SB_GUARD_HEALTH_URL="http://127.0.0.1:6020/health",SB_GUARD_APP_DIR="/opt/api",SB_GUARD_SERVICE="pm-api",SB_GUARD_WAIT="90"
priority=30

; nginx（admin 静态站 :80 + 反代 API）
; 配置统一放 /opt，nginx 默认读 /etc/nginx/nginx.conf，必须显式 -c 指向
[program:nginx]
command=nginx -c /opt/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
