# 容器内 nginx —— admin 静态站(:80) + 反代 API(127.0.0.1:6020)
# admin 用 hash 路由 + API 相对路径 /admin，同域无跨域、无需 SPA fallback。

user root;
worker_processes auto;
error_log /app/logs/nginx-error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /app/logs/nginx-access.log;

    sendfile on;
    keepalive_timeout 65;

    # 上传体积上限（与后端一致 ≥500M）
    client_max_body_size 500M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后端 API（容器内本地端口）
    upstream pm_api {
        server 127.0.0.1:6020;
    }

    server {
        listen 80 default_server;
        server_name _;

        # admin 静态站
        root /app/admin;
        index index.html;

        # admin 是 hash 路由（/#/...），根路径直接给 index.html 即可
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ===== 反代后端 =====
        location /admin/ {
            proxy_pass http://pm_api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /agent/ {
            proxy_pass http://pm_api/agent/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://pm_api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /storage/ {
            proxy_pass http://pm_api/storage/;
            proxy_set_header Host $host;
        }

        location /upload/ {
            proxy_pass http://pm_api/upload/;
            client_max_body_size 500M;
            proxy_set_header Host $host;
        }

        # webterm WebSocket（必须，否则网页终端连不上）
        location /webterm/ws/ {
            proxy_pass http://pm_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # swagger（可选，调试用）
        location /swagger/ {
            proxy_pass http://pm_api/swagger/;
            proxy_set_header Host $host;
        }

        # 健康检查直透后端
        location = /health {
            proxy_pass http://pm_api/health;
            proxy_set_header Host $host;
        }
    }
}
