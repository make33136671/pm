image: mcr.microsoft.com/dotnet/sdk:10.0

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

stages:
  - validate
  - build
  - test

# NuGet 缓存：包走私有 baget(Mirror 模式代理 nuget.org 并缓存），
# 这里再把 .nuget/packages 按 key 缓存到 Runner，二次构建命中、免重复下载。
cache:
  key:
    files:
      - sb-apps-pm.sln
  paths:
    - .nuget/packages

# ============ Stage 1: 规范检查 ============

lint:naming:
  stage: validate
  script:
    - echo "=== 检查表前缀（PM 派生只能用 sb_pm_*，基座共享 sb_*） ==="
    - |
      BAD=$(grep -rhE '\[Table\(Name = "([^"]+)"' Sb.Apps.Pm.Models --include="*.cs" 2>/dev/null \
        | grep -oE '"[^"]+"' | grep -vE '^"(sb_pm_|sb_)' || true)
      if [ -n "$BAD" ]; then
        echo "❌ 以下表前缀不合规（必须 sb_pm_* 或 sb_*）："
        echo "$BAD"
        exit 1
      fi
    - echo "=== 检查命名空间（必须 Sb.Apps.Pm.*） ==="
    - |
      if grep -rln "^namespace SbPm\.\|^namespace SB\.Pm\." Sb.Apps.Pm.* 2>/dev/null; then
        echo "❌ 派生项目命名空间必须 Sb.Apps.Pm.*"
        exit 1
      fi
    - echo "✓ 命名规范检查通过"

# ============ Stage 2: 编译 ============

build:
  stage: build
  # 包全部走仓库 NuGet.config 里唯一的私有源 saibo-baget（匿名只读即可，
  # 私有 SB.Framework.* / SB.Chat 包它自有，公网包它 Mirror 代理 nuget.org）。
  script:
    - dotnet restore sb-apps-pm.sln
    - dotnet build sb-apps-pm.sln -c Release --no-restore
  artifacts:
    expire_in: 1 hour
    paths:
      - "**/bin/Release/"
      - "**/obj/"

# ============ Stage 3: 单元测试 ============

test:
  stage: test
  needs: ["build"]
  script:
    - dotnet test sb-apps-pm.sln -c Release
        --no-restore
        --logger "junit;LogFilePath=$CI_PROJECT_DIR/test-results/{assembly}.xml"
        --collect:"XPlat Code Coverage"
  coverage: '/Total\s*\|\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - test-results/
    reports:
      junit: test-results/*.xml
